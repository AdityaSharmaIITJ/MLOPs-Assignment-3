name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ docker_ci ]
  pull_request:
    branches: [ docker_ci ]

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run training script
      run: |
        python src/train.py
        
    - name: Verify model files exist
      run: |
        ls -la models/
        test -f models/california_housing_model.joblib
        test -f models/test_data.joblib
        
    - name: Build Docker image
      run: |
        docker build -t mlops-housing-model:latest .
        
    - name: Run Docker container verification
      run: |
        docker run --rm mlops-housing-model:latest python src/predict.py
        
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Push Docker image to registry
      run: |
        docker tag mlops-housing-model:latest ${{ secrets.DOCKER_USERNAME }}/mlops-housing-model:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/mlops-housing-model:latest
        
    - name: Print success message
      run: |
        echo "Docker container built and tested successfully!"
        echo "Image pushed to Docker Hub: ${{ secrets.DOCKER_USERNAME }}/mlops-housing-model:latest"
